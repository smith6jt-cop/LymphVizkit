[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lymphflow"
version = "0.1.0"
description = "Flow cytometry workbench for LymphVizkit: FCS ingest, compensation, scaling, gating, statistics, clustering jobs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "numpy>=2.0",
  "pyarrow>=18",
  "flowio>=1.4",
  "flowutils>=1.2",
]

[project.optional-dependencies]
# GatingML / FlowJo workspace import-export and the parity-test oracle.
interop = ["flowkit>=1.3"]
# Algorithm jobs. flowsom and igraph are GPL; they are only ever imported inside
# a job subprocess (lymphflow.jobs.steps.*), never by the service.
jobs = ["flowsom>=0.2", "umap-learn>=0.5", "anndata>=0.10"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
lymphflow = "lymphflow.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lymphflow = ["db/migrations/*.sql", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/parity"]
markers = [
  "network: needs raw.githubusercontent.com to fetch sha256-pinned fixtures",
  "jobs: needs the optional 'jobs' extra (flowsom)",
]
