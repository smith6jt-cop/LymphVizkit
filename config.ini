# LymphVizkit-Senior — Phenocycler_Analysis pipeline configuration.
#
# Consumed by the Phenocycler_Analysis package (add it as a git submodule at
# ./Phenocycler_Analysis and `pip install -e Phenocycler_Analysis` into scvi-env).
# Paths resolve relative to THIS file's directory (the repo root); the
# PHENOCYCLER_* env vars override (see scripts/senior/run_pipeline.sh).

[paths]
# Portable placeholders — edit for your environment, or override via the
# PHENOCYCLER_* env vars (see scripts/senior/run_pipeline.sh). data_dir and
# restore_vendor are repo-relative; the rest point at raw inputs outside the repo.
data_dir = data
images_dir = /path/to/images
cells_csv = /path/to/cell_measurements.csv
donor_metadata = /path/to/donor_metadata.xlsx
restore_vendor = external/RESTORE/python_code

[metadata]
donor_col = donor_id
status_col = disease.status

[redsea]
downsample = 1.0
edge_radius = 0
comp_mode = 0
alpha = 1.0
gap_bridge = 1

[restore]
model = SSC
subsample = 15000
robust = true
robust_factor = 3.0
min_cell_area = 5.0
seed = 0

[lineage]
hormone_min_norm = 5
cd99_bright = 3

[compute]
n_jobs = 8
duckdb_threads = 8
use_gpu = false
gpu_device = 0
