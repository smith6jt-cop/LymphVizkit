name: LymphVizkit CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true   # binary packages for fast, reliable installs

      - name: Install R data-path packages
        run: install.packages(c("readxl", "dplyr", "stringr", "tidyr", "jsonlite"))
        shell: Rscript {0}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python generator deps
        run: pip install numpy pandas openpyxl

      - name: Parse-check every R source file
        run: |
          bad <- FALSE
          for (f in list.files("app/shiny_app/R", pattern = "[.]R$", full.names = TRUE)) {
            e <- tryCatch({ parse(f); NULL }, error = function(err) conditionMessage(err))
            if (!is.null(e)) { cat("PARSE ERROR:", f, "->", e, "\n"); bad <- TRUE }
          }
          if (bad) quit(status = 1L) else cat("All R files parse OK\n")
        shell: Rscript {0}

      - name: Generate synthetic example data
        run: python scripts/make_synthetic_follicle_data.py

      - name: Data-loading smoke test
        run: Rscript scripts/test_shiny_prep.R

      - name: Viewer helpers unit tests
        run: Rscript scripts/test_viewer_helpers.R
