name: LymphVizkit CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true   # binary packages for fast, reliable installs

      - name: Install R data-path packages
        run: install.packages(c("readxl", "dplyr", "stringr", "tidyr", "jsonlite"))
        shell: Rscript {0}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python generator deps
        run: pip install numpy pandas openpyxl

      - name: Parse-check every R source file
        run: |
          bad <- FALSE
          for (f in list.files("app/shiny_app/R", pattern = "[.]R$", full.names = TRUE)) {
            e <- tryCatch({ parse(f); NULL }, error = function(err) conditionMessage(err))
            if (!is.null(e)) { cat("PARSE ERROR:", f, "->", e, "\n"); bad <- TRUE }
          }
          if (bad) quit(status = 1L) else cat("All R files parse OK\n")
        shell: Rscript {0}

      - name: Generate synthetic example data
        run: python scripts/make_synthetic_follicle_data.py

      - name: Data-loading smoke test
        run: Rscript scripts/test_shiny_prep.R

      - name: Viewer helpers unit tests
        run: Rscript scripts/test_viewer_helpers.R

  # Flow cytometry workbench (flow/): independent of the Shiny app and of the smoke job above.
  flow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flow
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: flow/pyproject.toml

      - name: Install lymphflow with all extras
        run: pip install -e ".[interop,jobs,dev]"

      - name: Unit, API and job tests (synthetic data, no network)
        run: python -m pytest tests/unit -q

      # Fetches ~56 MB of public reference files (sha256-pinned) from the FlowKit repository.
      - name: Parity tests (ISAC GatingML truth tables, FlowKit, FlowJo workspace)
        env:
          LYMPH_FLOW_REQUIRE_FIXTURES: "1"
        run: python -m pytest tests/parity -q
